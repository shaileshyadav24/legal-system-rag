# Nginx reverse proxy for the two services, terminating TLS via Let's
# Encrypt. Ships HTTP-only on purpose - certbot's nginx plugin (below)
# rewrites this file in place to add the HTTPS server blocks, the
# HTTP->HTTPS redirect, and cert paths, so there's nothing TLS-related to
# hand-maintain here.
#
# Setup on the VM (Ubuntu):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx/legalrag.conf /etc/nginx/sites-available/legalrag
#   sudo ln -s /etc/nginx/sites-available/legalrag /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # stock default server block would otherwise collide
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d auth.yourdomain.com -d api.yourdomain.com --redirect
#
# certbot obtains the certs, edits this file to add `listen 443 ssl` +
# certificate directives + the redirect, and installs a systemd timer for
# auto-renewal - no manual renewal or cert-path upkeep after this point.
#
# Replace yourdomain.com below first, and point both subdomains' DNS A
# records at this VM's (reserved) public IP before running certbot.
#
# Assumes apps/auth and apps/chat are reachable on 127.0.0.1:8001/8000 -
# true whether they're run via `docker run -p 127.0.0.1:...` (see
# CLAUDE.md) or this repo's docker-compose.yml, both of which bind to
# localhost only so nginx is the only way in from outside the VM.
#
# Note: ALLOWED_ORIGINS in .env is the browser-facing frontend's origin
# (e.g. https://app.yourdomain.com) that's allowed to call these APIs via
# CORS - it is NOT these auth./api. subdomains themselves.

upstream legalrag_auth {
    server 127.0.0.1:8001;
}

upstream legalrag_chat {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.yourdomain.com;

    location / {
        proxy_pass http://legalrag_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://legalrag_chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # tinyllama generation can take a while, especially on the Ampere
        # A1's CPU-only inference - default 60s read timeout cuts it close.
        proxy_read_timeout 120s;
    }
}
